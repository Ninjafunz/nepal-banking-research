# Nepal Banking Research Platform — Global Configuration
project_name: "nepal-banking-research"
version: "1.0.0"

# Monetary & Accounting conventions
currency_unit: "NPR Millions"
average_balance_method: true   # (t + t-1)/2 for ROA, ROE, NIM

# Fiscal Year coverage (Gregorian year-end)
fiscal_years:
  start: 2020
  end: 2025
macro_years:
  start: 2020
  end: 2026

# Competition / Concentration Index
# options: "percent_squared" (scale 0-10,000) or "decimal" (scale 0-1)
hhi_convention: "percent_squared"

# Concentration Thresholds (US DOJ / FTC standard)
hhi_thresholds:
  unconcentrated_max: 1000
  moderately_concentrated_max: 1800

# Multi-Format Export Targets
export_formats:
  - "xlsx"
  - "csv"
  - "parquet"
  - "dta"

# Validation Bounds
validation_rules:
  roa_min: -10.0
  roa_max: 15.0
  roe_min: -50.0
  roe_max: 60.0
  nim_min: 0.0
  nim_max: 12.0
  car_min_regulatory: 8.5
  cost_income_min: 5.0
  cost_income_max: 150.0
  balance_sheet_tolerance_pct: 1.0
