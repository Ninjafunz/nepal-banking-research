[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-banking-research"
version = "1.0.0"
description = "A benchmark research dataset, analytical pipeline, and dashboard for Nepal commercial banking sector (FY2020-FY2025)."
readme = "README.md"
authors = [
    { name = "Manjil Khadka", email = "charstose@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "numpy>=1.25.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]