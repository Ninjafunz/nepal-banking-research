[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-banking-research"
version = "1.0.0"
description = "A benchmark research dataset, analytical pipeline, and dashboard for Nepal commercial banking sector (FY2020-FY2025)."
readme = "README.md"
authors = [
    { name = "Manjil Khadka", email = "charstose@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "numpy>=1.25.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
include = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except — intentional for data pipeline resilience
    "SIM102",   # collapsible if — readability preference
    "S110",     # try-except-pass — intentional in extraction loops
    "S112",     # try-except-continue — intentional in extraction loops
    "PLW1510",  # subprocess.run without check — intentional
]
exclude = [
    "notebooks",
]

[tool.ruff.lint.per-file-ignores]
"extract_*.py" = ["F841"]  # extraction scripts may have unused intermediate variables

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
